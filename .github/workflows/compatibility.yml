name: Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Compile launcher and backend
        run: python -m compileall -q proxy tools/run-local.py
      - name: Verify ready local UI without frontend build
        run: python tools/check-web.py
      - name: Python-only startup with Node absent
        run: python -m pytest -q tests/test_frontend_static.py tests/test_windows_encoding.py
      - name: Launcher, file locking, config and SVG security contracts
        run: python -m pytest -q tests/test_platform_launcher.py tests/test_platform_io.py tests/test_pelican_svg_security.py tests/test_pelican_smil_offsets.py
      - name: Native application authentication, config and key contracts
        run: python -m pytest -q tests/test_app.py tests/test_security.py tests/test_admin_account.py

  # Optional backend scorer verification only; not a frontend build or launch prerequisite.
  numerical-artifacts:
    name: Optional numerical backend / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.lock
      - name: Pinned binary integrity and original numerical parity
        run: python -m pytest -q tests/test_detector_scoring.py tests/test_windows_encoding.py
